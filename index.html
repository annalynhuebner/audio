<!DOCTYPE html>
<html>
    <head>
         
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
     
        <a-scene> 
             <a-camera position="0 1.6 0">
            <a-cursor fuse="true" fuse-timeout="1000" color="black"></a-cursor>

 <a-assets>
      <audio id="soundEffect1" src="audio2.wav" preload="auto"></audio>
 </a-assets>

            
        <a-box
            position="0 1 -5"
            depth="2"
            height="2"
            width="2"
            color="tomato"
             sound="src: #soundEffect1; on: click; volume: 1;"
            animation="
                property: rotation;
                from: 0 0 0;
                to: 0 360 0;
                dur: 2000;
                easing: linear;
                loop: true;>
        </a-box>"
        </a-scene>
</html>
